name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gpu-info-x64-linux
            binary: build/gpu-info-x64
          - os: windows-latest
            artifact: gpu-info-x64-windows
            binary: build/Release/gpu-info-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = "$env:TEMP\vulkan-sdk.exe"
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
        Start-Process -FilePath $installer -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
        Remove-Item $installer
        $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
        if (-not $sdk) { Write-Error "Vulkan SDK not found after install"; exit 1 }
        "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
        Write-Host "VULKAN_SDK=$($sdk.FullName)"

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Rename & chmod
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          mv build/gpu-info build/gpu-info-x64
          chmod +x build/gpu-info-x64
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          mv build/Release/gpu-info.exe build/Release/gpu-info-x64.exe
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.binary }}

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2.2.1
      with:
        files: ${{ matrix.binary }}
